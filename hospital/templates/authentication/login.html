{% extends 'base.html' %}

{% block title %}
Login
{% endblock %}


{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow">

                <div class="card-body">

                    <h3 class="text-center mb-4">
                        Login
                    </h3>


                    <form method="POST">

                        {% csrf_token %}


                        <div class="mb-3">

                            <label>
                                Username
                            </label>

                            <input 
                                type="text"
                                name="username"
                                class="form-control"
                            >

                        </div>


                        <div class="mb-3">

                            <label>
                                Password
                            </label>

                            <input 
                                type="password"
                                name="password"
                                class="form-control"
                            >

                        </div>


                        <button 
                            class="btn btn-primary w-100"
                            type="submit"
                        >
                            Login
                        </button>


                    </form>


                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
